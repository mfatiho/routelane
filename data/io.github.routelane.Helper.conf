<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.routelane.Helper"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.routelane.Helper"
           send_interface="io.github.routelane.Helper1"/>
  </policy>
</busconfig>
